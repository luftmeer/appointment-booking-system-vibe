name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  python:
    name: Python
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    # Public CI-only placeholders. They are not production or reusable credentials.
    env:
      DJANGO_ENVIRONMENT: development
      DJANGO_SECRET_KEY: ci-only-appointment-booking-secret
      DJANGO_DEBUG: "false"
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1
      DATABASE_NAME: appointment_booking_ci
      DATABASE_TEST_NAME: appointment_booking_test
      DATABASE_USER: appointment_booking_ci
      DATABASE_PASSWORD: ci-only-appointment-booking-database-password
      DATABASE_HOST: 127.0.0.1
      DATABASE_PORT: "5432"
      DATABASE_CONNECT_TIMEOUT: "2"

    services:
      postgres:
        image: postgres:16.13-bookworm@sha256:472efd9a66f2b2f1a5aeb18b28de74332e6ef88c2b93a1a5d812fb6db67a5f60
        env:
          POSTGRES_DB: appointment_booking_ci
          POSTGRES_USER: appointment_booking_ci
          POSTGRES_PASSWORD: ci-only-appointment-booking-database-password
          POSTGRES_INITDB_ARGS: --auth-host=scram-sha-256 --auth-local=scram-sha-256
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready --username appointment_booking_ci --dbname appointment_booking_ci"
          --health-interval 2s
          --health-timeout 2s
          --health-retries 15
          --health-start-period 5s

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.11.32"
          python-version: "3.12"
          enable-cache: false

      - name: Install dependencies
        run: uv sync --locked

      - name: Check Django configuration
        run: uv run python manage.py check

      - name: Lint Python
        run: uv run ruff check .

      - name: Check Python formatting
        run: uv run ruff format --check .

      - name: Test Python
        run: uv run pytest
